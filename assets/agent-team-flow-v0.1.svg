<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t">
  <title id="t">小队协作流程：负责人规划，侦察员、图书管理员、扫参员、质疑者分工，所有人先读后写共享台账，结论只能落入四个固定判定类别</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d6b7d"/>
    </marker>
  </defs>
  <style>
    .s{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}
    .m{font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace}
  </style>
  <rect width="960" height="480" fill="#f7f6f2"/>
  <text x="480" y="40" class="s" font-size="22" font-weight="700" fill="#1f3b4d" text-anchor="middle">提出想法的人，不给自己打分</text>
  <text x="480" y="64" class="s" font-size="14" fill="#637568" text-anchor="middle">The agent that has the idea never grades it</text>
  <!-- Lead -->
  <rect x="40" y="170" width="150" height="80" rx="12" fill="#1f3b4d"/>
  <text x="115" y="204" class="s" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">负责人 Lead</text>
  <text x="115" y="228" class="s" font-size="13" fill="#cfe0ea" text-anchor="middle">拆任务 · 定终点</text>
  <!-- Scout & Librarian -->
  <rect x="250" y="110" width="160" height="70" rx="12" fill="#1f5f63"/>
  <text x="330" y="140" class="s" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">侦察员 Scout</text>
  <text x="330" y="162" class="s" font-size="13" fill="#d7ece9" text-anchor="middle">先查数据</text>
  <rect x="250" y="240" width="160" height="70" rx="12" fill="#1f5f63"/>
  <text x="330" y="270" class="s" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">图书管理员</text>
  <text x="330" y="292" class="s" font-size="13" fill="#d7ece9" text-anchor="middle">找前人证据</text>
  <!-- Sweeper -->
  <rect x="470" y="170" width="150" height="80" rx="12" fill="#637568"/>
  <text x="545" y="204" class="s" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">扫参员 Sweeper</text>
  <text x="545" y="228" class="s" font-size="13" fill="#e4ebe6" text-anchor="middle">跑预设网格·全记录</text>
  <!-- Skeptic -->
  <rect x="680" y="170" width="150" height="80" rx="12" fill="#b5654a"/>
  <text x="755" y="204" class="s" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">质疑者 Skeptic</text>
  <text x="755" y="228" class="s" font-size="13" fill="#f6e2da" text-anchor="middle">最强模型·尽力推翻</text>
  <!-- arrows -->
  <g stroke="#4d6b7d" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M190,195 L248,150"/>
    <path d="M190,225 L248,270"/>
    <path d="M410,145 L468,195"/>
    <path d="M410,275 L468,228"/>
    <path d="M620,210 L678,210"/>
    <path d="M830,210 L870,210 L870,330"/>
  </g>
  <!-- verdicts -->
  <text x="870" y="352" class="s" font-size="14" font-weight="700" fill="#1f3b4d" text-anchor="middle">固定判定</text>
  <rect x="700" y="364" width="80" height="30" rx="15" fill="#2f7d4f"/>
  <text x="740" y="384" class="s" font-size="13" fill="#fff" text-anchor="middle">采纳</text>
  <rect x="790" y="364" width="80" height="30" rx="15" fill="#c0504d"/>
  <text x="830" y="384" class="s" font-size="13" fill="#fff" text-anchor="middle">否决</text>
  <rect x="700" y="402" width="110" height="30" rx="15" fill="#96704f"/>
  <text x="755" y="422" class="s" font-size="13" fill="#fff" text-anchor="middle">需更多数据</text>
  <rect x="820" y="402" width="110" height="30" rx="15" fill="#7d8a90"/>
  <text x="875" y="422" class="s" font-size="13" fill="#fff" text-anchor="middle">无法判断</text>
  <!-- ledger -->
  <rect x="40" y="360" width="600" height="80" rx="12" fill="#ffffff" stroke="#1f3b4d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="60" y="390" class="m" font-size="16" font-weight="700" fill="#1f3b4d">research.md</text>
  <text x="190" y="390" class="s" font-size="15" fill="#1f3b4d">共享台账：每个角色先读、最后写</text>
  <text x="60" y="420" class="s" font-size="13" fill="#637568">失败结果也记下 → 死掉的想法不再重试 · 留出数据按时间切分，只在最后用一次</text>
  <g stroke="#9aa9b2" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="115" y1="250" x2="115" y2="358"/>
    <line x1="330" y1="310" x2="330" y2="358"/>
    <line x1="545" y1="250" x2="545" y2="358"/>
    <line x1="755" y1="250" x2="640" y2="368"/>
  </g>
</svg>
