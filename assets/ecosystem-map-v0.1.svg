  <rect x="640" y="360" width="300" height="110" rx="12" fill="#ffffff" stroke="#637568" stroke-width="3"/>
  <rect x="640" y="360" width="300" height="38" rx="12" fill="#637568"/>
  <rect x="640" y="386" width="300" height="12" fill="#637568"/>
