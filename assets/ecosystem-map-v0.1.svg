  <rect x="345" y="420" width="270" height="110" rx="12" fill="#ffffff" stroke="#b5654a" stroke-width="3"/>
  <rect x="345" y="420" width="270" height="38" rx="12" fill="#b5654a"/>
  <rect x="345" y="446" width="270" height="12" fill="#b5654a"/>
  <text x="363" y="446" class="s" font-size="17" font-weight="700" fill="#fff">Memory · 持久笔记</text>
  <text x="363" y="484" class="m" font-size="13" fill="#1f3b4d">10 eugeniughelbur/</text>
  <text x="383" y="504" class="m" font-size="13" fill="#1f3b4d">obsidian-second-brain</text>
  <text x="480" y="550" class="s" font-size="12" fill="#637568" text-anchor="middle">本仓库原创图示 · 仓库归各自作者所有</text>
